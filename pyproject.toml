[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwise-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.9", "pymupdf>=1.24", "pytesseract>=0.3.10", "Pillow>=10", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1", "chromadb>=1.0,<2", "sentence-transformers>=3,<6", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
ingestion = ["pymupdf>=1.24", "pytesseract>=0.3.10", "Pillow>=10", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.package-data]
"app.db" = ["schema.sql"]
